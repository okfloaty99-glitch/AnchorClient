
name: Build AnchorClient

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.7'

      - name: Compile Minecraft Forge mod
        run: gradle setupDecompWorkspace build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnchorClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
